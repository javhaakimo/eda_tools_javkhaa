[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-tools-javkhaa"
version = "0.1.1"
description = "Simple EDA tools for statistics and data analysis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn"
]
